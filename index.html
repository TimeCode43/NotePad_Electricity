<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d5b">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Блокнот мастера</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--ln:#dfe3e8;--ac:#2f7d5b;--neg:#c0392b;--pos:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--card:#1c2025;--tx:#e8ebee;--mut:#97a0ab;--ln:#2d333a;--ac:#3fa57a;--neg:#ef7a6b;--pos:#4cc380}}
:root[data-theme="dark"]{--bg:#121518;--card:#1c2025;--tx:#e8ebee;--mut:#97a0ab;--ln:#2d333a;--ac:#3fa57a;--neg:#ef7a6b;--pos:#4cc380}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
button{font:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button,.fl button,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font-weight:600}
.tabs button{flex:1}
.tabs .on,.fl .on,.btn{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{width:100%;margin-top:8px}
.btn.alt{background:var(--card);color:var(--ac)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fl button{padding:6px 12px;font-size:14px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;min-width:0;width:100%}
textarea{resize:vertical;font-size:14px;line-height:1.35}
label{font-size:12px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.row .n{flex:1 1 100%}
.row .a{flex:1 1 90px}
.row .p{flex:0 0 62px}
.u{color:var(--mut)}
.h{flex:1;font-size:13px;color:var(--mut)}
.x{border:0;background:none;color:var(--neg);font-size:22px;padding:0 8px;line-height:1}
.s{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ln)}
.big{font-size:19px;border:0;padding-top:10px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g .f{grid-column:1/-1}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0}
.b{border:0;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;color:#fff;flex:none}
.act{background:#d98e04}.done{background:#1f8a4c}.rej{background:#8a8f98}
#cm,#rs{font-size:16px;resize:none;overflow:hidden;min-height:48px}
.ad{color:var(--ac);text-decoration:underline;word-break:break-word}
.rs{border:1px solid var(--neg);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.cm{white-space:pre-wrap;word-break:break-word}
#ft{border-bottom:1px solid var(--ln);padding-bottom:8px}
.row+.row{border-top:1px dashed var(--ln);border-top:1px dashed color-mix(in srgb,var(--mut) 55%,transparent);padding-top:10px}
.ch{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.ar{font-size:16px;line-height:1;transition:transform .15s;padding:0 4px}
.card.c .ar{transform:rotate(-90deg)}
.card.c>.bd{display:none}
.card.c>.ch{margin-bottom:0}
.mo{border-top:1px solid var(--ln);margin-top:8px;padding-top:8px}
.cp{border:0;background:none;color:var(--mut);padding:0 4px;margin-left:2px;line-height:1;vertical-align:middle;display:inline-flex;align-items:center}
.cp svg{width:15px;height:15px;pointer-events:none}
.cp.ok{color:var(--pos)}
</style>
</head>
<body>
<main>
<div class="tabs"><button class="on" data-t="day">День</button><button data-t="ord">Заказы</button></div>

<section id="day">
<div class="card"><h2>Загрузить дневную отчётность</h2>
<button class="btn" id="ld" style="margin-top:0">Вставить отчёт из буфера</button>
<textarea id="pi" rows="6" placeholder="Вставьте отчёт сюда" hidden style="margin-top:8px"></textarea>
<button class="btn alt" id="pa" hidden>Разобрать</button>
<p class="u" id="lm" style="margin:8px 0 0;font-size:13px"></p></div>
<div class="card"><label>Дата</label><input type="date" id="cd"></div>
<div class="card" data-col="j"><h2 class="ch">Заработано<span class="ar">▾</span></h2><div class="bd"><p class="u" style="margin:-4px 0 10px;font-size:13px">Комиссия офису считается сама: от 5000₽ — 50%, меньше — 60%.</p><div id="jobs"></div><button class="btn alt" data-add="j">+ Заказ</button></div></div>
<div class="card" data-col="d"><h2 class="ch">Вычеты<span class="ar">▾</span></h2><div class="bd"><div id="deds"></div><button class="btn alt" data-add="d">+ Вычет</button></div></div>
<div class="card" data-col="s"><h2 class="ch">Траты<span class="ar">▾</span></h2><div class="bd"><div id="sps"></div><button class="btn alt" data-add="s">+ Трата</button></div></div>
<div class="card"><h2>Итоги</h2><div id="sum"></div></div>
<div class="card"><h2>Отчёт</h2><textarea id="rep" rows="20" readonly></textarea><button class="btn" id="cp">Копировать отчёт</button></div>
</section>

<section id="ord" hidden>
<div class="card"><h2 id="oht">Новый заказ</h2>
<div class="g">
<div class="f"><label>Адрес</label><input id="ad" placeholder="Улица, дом, кв."></div>
<div><label>Дата</label><input type="date" id="dt"></div>
<div><label>Время</label><input type="time" id="tm"></div>
<div class="f"><label>Комментарий</label><textarea id="cm" rows="2"></textarea></div>
<div class="f"><label>Статус</label><select id="st"><option value="act">Активный</option><option value="done">Завершил</option><option value="rej">Отказ</option></select></div>
<div class="f" id="rsw" hidden><label>Причина отказа клиента</label><textarea id="rs" rows="2" placeholder="Почему клиент отказался"></textarea></div>
<div><label>Сумма услуг, ₽</label><input id="sm" type="number" inputmode="decimal"></div>
<div><label>Чистая выручка, ₽</label><input id="nt" type="number" inputmode="decimal"></div>
</div>
<button class="btn" id="ob">Добавить</button></div>
<button class="btn alt" id="fb" style="margin:0 0 10px">Фильтр ▾</button>
<div class="card" id="fp" hidden><div class="fl" id="ft"><button class="on" data-i="0">Статус</button><button data-i="1">Дата</button><button data-i="2">Выручка</button></div><div class="fl" id="fo" style="margin:0"></div></div>
<p class="u" id="ot"></p>
<div id="ol"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s),N=v=>+v||0;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=()=>new Date().toLocaleDateString('sv-SE');
const ru=d=>d.split('-').reverse().join('.');
let S={days:{},orders:[],lp:60,col:{}};
try{const r=JSON.parse(localStorage.getItem('blk1'));if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem('blk1',JSON.stringify(S))}catch(e){}};
const money=n=>{n=Math.round(n);return (n<0?'-':'')+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'₽'};
const sgn=n=>(n<0?'':'+')+money(n);

/* ---------- ДЕНЬ ---------- */
let cur=iso();
const day=()=>S.days[cur]||(S.days[cur]={j:[],d:[],s:[]});
const pc=a=>N(a)>=5000?50:60;
const PH={j:'Что сделал (замена розетки)',d:'За что (за еду, автобус)',s:'Куда (хостел)'};
const EL={j:'#jobs',d:'#deds',s:'#sps'};

function list(k){
  const el=$(EL[k]);el.innerHTML='';
  day()[k].forEach((r,i)=>{
    const w=document.createElement('div');w.className='row';
    w.innerHTML=`<input class="n" placeholder="${PH[k]}" value="${esc(r.n)}"><input class="a" type="number" inputmode="decimal" placeholder="Сумма ₽" value="${esc(r.a)}">`
      +`<span class="h"></span><button class="x">×</button>`;
    w.oninput=e=>{const t=e.target.className;
      if(t=='n')r.n=e.target.value;
      else if(t=='a')r.a=e.target.value;
      calc()};
    w.querySelector('.x').onclick=()=>{day()[k].splice(i,1);draw()};
    el.appendChild(w);
  });
}
function draw(){$('#cd').value=cur;list('j');list('d');list('s');calc()}

function calc(){
  const D=day();let tot=0,me=0;
  [...$('#jobs').children].forEach((w,i)=>{
    const r=D.j[i],a=N(r.a),m=a*(100-pc(a))/100;tot+=a;me+=m;
    w.querySelector('.h').textContent=a?`комиссия ${pc(a)}% · мне ${money(m)}`:'';
  });
  const sm=k=>D[k].reduce((t,r)=>t+N(r.a),0),ded=sm('d'),sp=sm('s'),off=tot-me,pk=me-ded,left=pk-sp;
  $('#sum').innerHTML=[['Вывод (всего)',sgn(tot)],['Офис','-'+money(off),'#FF0000'],['Мне',sgn(me),'#32CD32'],['Вычеты',sgn(-ded),ded>0&&'#FF7F50'],['На карман',sgn(pk)],['Траты',sgn(-sp),sp>0&&'#FF4500']]
    .map(([a,b,c])=>`<div class="s"><span>${a}</span><b${c?` style="color:${c}"`:''}>${b}</b></div>`).join('')
    +`<div class="s big"><span>Чистая дневная выручка</span><b class="${left<0?'neg':'pos'}">${sgn(left)}</b></div>`;
  const HR='━━━━━━━━━━━━━━━',L=[`📅 ${ru(cur)}`,HR,'','💼 ЗАРАБОТАНО'];
  D.j.forEach(r=>{const a=N(r.a);if(!a&&!r.n)return;const c=pc(a);
    L.push(`▪ ${r.n||'заказ'}`,`   ${sgn(a)} → мне ${money(a*(100-c)/100)} · офису ${money(a*c/100)} (${c}%)`)});
  L.push('',`Вывод: ${sgn(tot)}`,HR,`🏢 Офис: -${money(off)}`,`🙋 Мне: ${sgn(me)}`,HR);
  if(D.d.length){L.push('','🧾 ВЫЧЕТЫ');D.d.forEach(r=>L.push(`▪ ${r.n||'расход'}: -${money(N(r.a))}`))}
  L.push('',`💰 НА КАРМАН: ${sgn(pk)}`);
  if(D.s.length){L.push(HR,'','🏠 ТРАТЫ');D.s.forEach(r=>L.push(`▪ ${r.n||'трата'}: -${money(N(r.a))}`))}
  L.push(HR,'',`✅ В КАРМАНЕ ИТОГО СЕГОДНЯ: ${sgn(left)}`);
  $('#rep').value=L.join('\n');
  save();
}

document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.add;
  day()[k].push(k=='j'?{n:'',a:''}:{n:'',a:''});
  list(k);calc();
  const rows=$(EL[k]).children;rows[rows.length-1].querySelector('.n').focus();
});
$('#cd').onchange=e=>{cur=e.target.value||iso();draw()};
document.querySelectorAll('[data-col]').forEach(c=>{
  const k=c.dataset.col,set=()=>c.classList.toggle('c',!!S.col[k]);
  set();c.querySelector('.ch').onclick=()=>{S.col[k]=S.col[k]?0:1;set();save()};
});
$('#cp').onclick=async()=>{
  const t=$('#rep');
  try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();try{document.execCommand('copy')}catch(_){}}
  $('#cp').textContent='Скопировано ✓';setTimeout(()=>$('#cp').textContent='Копировать отчёт',1500);
};

/* ---------- ЗАГРУЗКА ОТЧЁТА ---------- */
function parseRep(txt){
  const R={d:null,j:[],dd:[],s:[]},AM=/([+\-])?\s*(\d[\d.\s]*)\s*₽/,num=s=>+s.replace(/\D/g,'')||0;
  let m=null,pend='',last=null;
  txt.split(/\r?\n/).forEach(raw=>{
    const t=raw.trim().replace(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F\s]+/u,'');
    if(!t||/^[━\-–—_=\s]{3,}$/.test(t))return;
    const U=t.toUpperCase();
    if(!R.d){const x=t.match(/(\d{2})\.(\d{2})\.(\d{4})/);if(x)R.d=x[3]+'-'+x[2]+'-'+x[1]}
    if(/ЗАРАБОТАНО/.test(U)){m='j';pend='';return}
    if(/^(ВЫВОД|ИТОГО|ОФИС|МНЕ[\s:])|НА КАРМАН|КАРМАНЕ ИТОГО/.test(U)){m=null;return}
    if(/^ВЫЧЕТ/.test(U)){m='d';last=null;return}
    if(/^ТРАТЫ/.test(U)){m='s';last=null;return}
    const am=t.match(AM);
    if(m=='j'){
      if(/^[▪•·]/.test(t)&&!am){pend=t.replace(/^[▪•·]\s*/,'');return}
      if(am&&am[1]=='+'){const p=t.match(/\(([^)]*)\)/);R.j.push({n:pend||(p?p[1]:''),a:num(am[2])});pend=''}
    }else if(m){
      const L=m=='d'?R.dd:R.s;
      if(am)L.push(last={n:t.replace(AM,'').replace(/^[▪•·]\s*/,'').replace(/[:\s]+$/,'').replace(/\s+/g,' ').trim(),a:num(am[2])});
      else if(last)last.n=(last.n+' '+t.replace(/^\(|\)$/g,'')).trim();
    }
  });
  return R;
}
const msg=t=>{$('#lm').textContent=t};
const manual=on=>{$('#pi').hidden=$('#pa').hidden=!on};
function importRep(txt){
  const R=parseRep(txt);
  if(!R.j.length&&!R.dd.length&&!R.s.length){msg('Не нашёл в тексте данных отчёта.');return}
  const dt=R.d||cur,o=S.days[dt];
  if(o&&(o.j.length||o.d.length||o.s.length)){let ok=false;try{ok=confirm('За '+ru(dt)+' уже есть записи. Заменить их?')}catch(e){}if(!ok)return}
  const mk=a=>a.map(r=>({n:r.n,a:String(r.a)}));
  cur=dt;S.days[cur]={j:mk(R.j),d:mk(R.dd),s:mk(R.s)};
  draw();manual(false);$('#pi').value='';
  msg('Загружено за '+ru(cur)+': заказов '+R.j.length+', вычетов '+R.dd.length+', трат '+R.s.length+'.');
}
$('#ld').onclick=async()=>{
  let ok=true;try{ok=confirm('Вставить отчёт из буфера обмена?')}catch(e){}
  if(!ok)return;
  try{const t=await navigator.clipboard.readText();if(!t.trim()){msg('Буфер обмена пуст.');return}importRep(t)}
  catch(e){manual(true);msg('Не удалось прочитать буфер: вставьте отчёт в поле ниже и нажмите «Разобрать».')}
};
$('#pa').onclick=()=>importRep($('#pi').value);

/* ---------- ЗАКАЗЫ ---------- */
const ST={act:'Активный',done:'Завершил',rej:'Отказ'},NEXT={act:'done',done:'rej',rej:'act'};
let eid=null,flt='all',ftab=0,srt='new';

const fit=t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,48)+'px'};
const rsShow=()=>{$('#rsw').hidden=$('#st').value!='rej';fit($('#rs'))};
const geo=a=>(/iPhone|iPad/.test(navigator.userAgent)?'https://maps.apple.com/?q=':'geo:0,0?q=')+encodeURIComponent(a);
$('#cm').oninput=()=>fit($('#cm'));$('#rs').oninput=()=>fit($('#rs'));$('#st').onchange=rsShow;
const SV=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO=SV('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),CHK=SV('<polyline points="5 12 10 17 19 7"/>');
const cpb=t=>`<button class="cp" data-cp="${esc(t)}" title="Копировать" aria-label="Копировать">${ICO}</button>`;
async function copyTxt(t){
  try{await navigator.clipboard.writeText(t)}catch(e){
    const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);
    a.select();try{a.setSelectionRange(0,t.length)}catch(_){}try{document.execCommand('copy')}catch(_){}a.remove();
  }
}
const PHN=/(^|\D)((?:(?:\+7|[78])[\s\-]*\(?\d{3}\)?|\(?9\d{2}\)?)[\s\-]*\d{3}[\s\-]*\d{2}[\s\-]*\d{2})(?!\d)/g;
function rich(s){
  s=String(s==null?'':s);let o='',i=0,m;PHN.lastIndex=0;
  while((m=PHN.exec(s))){
    const st=m.index+m[1].length,ph=m[2];let d=ph.replace(/\D/g,'');
    if(d.length==10)d='7'+d;else if(d[0]=='8')d='7'+d.slice(1);
    o+=esc(s.slice(i,st))+`<a class="ad" href="tel:+${d}">${esc(ph)}</a>${cpb('+'+d)}`;
    i=st+ph.length;
  }
  return o+esc(s.slice(i));
}
function oForm(o){
  o=o||{ad:'',dt:iso(),tm:'',cm:'',st:'act',sm:'',nt:''};
  $('#ad').value=o.ad;$('#dt').value=o.dt;$('#tm').value=o.tm;$('#cm').value=o.cm;
  $('#st').value=o.st;$('#sm').value=o.sm;$('#nt').value=o.nt;$('#rs').value=o.rs||'';rsShow();fit($('#cm'));
  $('#ob').textContent=eid?'Сохранить':'Добавить';
  $('#oht').textContent=eid?'Редактирование':'Новый заказ';
}
function oRender(){
  const K=x=>x.dt+x.tm,cmp={new:(a,b)=>K(b).localeCompare(K(a)),old:(a,b)=>K(a).localeCompare(K(b)),dsc:(a,b)=>N(b.nt)-N(a.nt),asc:(a,b)=>N(a.nt)-N(b.nt)}[srt];
  const O=S.orders.filter(o=>flt=='all'||o.st==flt).sort(cmp);
  const dn=O.filter(o=>o.st=='done');
  $('#ot').textContent=`Показано: ${O.length} · завершено: ${dn.length} · услуги ${money(dn.reduce((t,o)=>t+N(o.sm),0))} · чистая ${money(dn.reduce((t,o)=>t+N(o.nt),0))}`;
  $('#ol').innerHTML=O.map(o=>`<div class="card">
    <div class="oh"><b>${o.ad?`<a class="ad" href="${geo(o.ad)}">${esc(o.ad)}</a>${cpb(o.ad)}`:'Без адреса'}</b><button class="b ${o.st}" data-c="${o.id}">${ST[o.st]}</button></div>
    <div class="u">${ru(o.dt)} ${esc(o.tm)}</div>${o.cm?`<div class="cm">${rich(o.cm)}</div>`:''}${o.st=='rej'?`<div class="rs"><b>Причина отказа:</b> <span class="cm">${rich(o.rs)||'не указана'}</span></div>`:''}
    <div class="oh${o.st=='done'?' mo':''}">${o.st=='done'?`<span>Услуги <b>${money(N(o.sm))}</b> · Чистая <b style="color:#32CD32">${money(N(o.nt))}</b></span>`:'<span></span>'}
    <span><button class="x" style="color:var(--ac)" data-e="${o.id}">✎</button><button class="x" data-d="${o.id}">×</button></span></div></div>`).join('')||'<p class="u">Заказов пока нет</p>';
}
$('#ob').onclick=()=>{
  const o={id:eid||Date.now(),ad:$('#ad').value.trim(),dt:$('#dt').value||iso(),tm:$('#tm').value,cm:$('#cm').value.trim(),st:$('#st').value,rs:$('#st').value=='rej'?$('#rs').value.trim():'',sm:$('#sm').value,nt:$('#nt').value};
  if(eid){const i=S.orders.findIndex(x=>x.id==eid);if(i>=0)S.orders[i]=o;else S.orders.push(o)}else S.orders.push(o);
  eid=null;save();oForm();oRender();
};
$('#ol').onclick=e=>{
  const cb=e.target.closest('[data-cp]');
  if(cb){copyTxt(cb.dataset.cp).then(()=>{cb.classList.add('ok');cb.innerHTML=CHK;setTimeout(()=>{cb.classList.remove('ok');cb.innerHTML=ICO},1200)});return}
  const d=e.target.dataset;
  if(d.c){const o=S.orders.find(x=>x.id==d.c);o.st=NEXT[o.st];save();oRender()}
  else if(d.d){S.orders=S.orders.filter(x=>x.id!=d.d);if(eid==d.d){eid=null;oForm()}save();oRender()}
  else if(d.e){eid=+d.e;oForm(S.orders.find(x=>x.id==eid));scrollTo({top:0,behavior:'smooth'})}
};
const FT=[[['all','Все'],['act','Активные'],['done','Завершённые'],['rej','Отказы']],[['new','Новые'],['old','Старые']],[['dsc','По убыванию'],['asc','По возрастанию']]];
const FN={all:'Все',act:'Активные',done:'Завершённые',rej:'Отказы',new:'Новые',old:'Старые',dsc:'Выручка ↓',asc:'Выручка ↑'};
function fRender(){
  document.querySelectorAll('#ft button').forEach((b,i)=>b.classList.toggle('on',i==ftab));
  $('#fo').innerHTML=FT[ftab].map(([k,t])=>`<button data-k="${k}"${(ftab?srt:flt)==k?' class="on"':''}>${t}</button>`).join('');
  $('#fb').textContent='Фильтр: '+FN[flt]+' · '+FN[srt]+' ▾';
}
$('#fb').onclick=()=>{$('#fp').hidden=!$('#fp').hidden};
$('#ft').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;ftab=+i;fRender()};
$('#fo').onclick=e=>{const k=e.target.dataset.k;if(!k)return;if(ftab)srt=k;else flt=k;fRender();oRender()};

/* ---------- ВКЛАДКИ ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));
  $('#day').hidden=b.dataset.t!='day';$('#ord').hidden=b.dataset.t!='ord';
});

draw();oForm();fRender();oRender();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
