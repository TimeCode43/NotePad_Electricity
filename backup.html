<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Резервная копия</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--ln:#dfe3e8;--ac:#2f7d5b}
@media (prefers-color-scheme:dark){:root{--bg:#121518;--card:#1c2025;--tx:#e8ebee;--mut:#97a0ab;--ln:#2d333a;--ac:#3fa57a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 10px;color:var(--mut);font-size:14px}
button{font:inherit;width:100%;margin-top:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:10px;padding:10px;font-weight:600}
button.alt{background:var(--card);color:var(--ac)}
textarea{font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;width:100%}
#st{font-weight:600;color:var(--tx)}
</style>
</head>
<body>
<main>
<div class="card"><h2>Данные в приложении</h2>
<p id="st">…</p>
<button id="cp">Скопировать копию данных</button>
<button class="alt" id="dl">Скачать копию файлом</button>
<p id="m" style="margin:10px 0 0"></p></div>
<div class="card"><h2>Восстановить из копии</h2>
<p>Вставьте сюда ранее скопированный текст. Текущие данные будут заменены.</p>
<textarea id="ta" rows="5" placeholder="Вставьте копию данных"></textarea>
<button class="alt" id="rs">Восстановить</button></div>
</main>
<script>
const $=s=>document.querySelector(s),K='blk1';
const get=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
const msg=t=>$('#m').textContent=t;
function info(){
  const r=get();
  if(!r){$('#st').textContent='Данных не найдено.';return}
  try{const d=JSON.parse(r);
    $('#st').textContent='Заказов: '+(d.orders||[]).length+' · дней с отчётами: '+Object.keys(d.days||{}).length+' · услуг: '+(d.svc||[]).length;
  }catch(e){$('#st').textContent='Данные повреждены.'}
}
$('#cp').onclick=async()=>{
  const r=get();if(!r){msg('Нечего копировать.');return}
  try{await navigator.clipboard.writeText(r);msg('Скопировано. Вставьте текст в заметки или отправьте себе в мессенджер.')}
  catch(e){$('#ta').value=r;$('#ta').select();msg('Не удалось скопировать автоматически: текст помещён в поле ниже, скопируйте его вручную.')}
};
$('#dl').onclick=()=>{
  const r=get();if(!r){msg('Нечего скачивать.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'application/json'}));
  a.download='blocknot-backup-'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.appendChild(a);a.click();a.remove();
  msg('Файл сохранён.');
};
$('#rs').onclick=()=>{
  const t=$('#ta').value.trim();let d;
  try{d=JSON.parse(t);if(!d||typeof d!='object'||!('orders' in d||'days' in d))throw 0}catch(e){msg('Это не похоже на копию данных.');return}
  if(!confirm('Заменить текущие данные восстановленными?'))return;
  try{localStorage.setItem(K,t);msg('Готово. Данные восстановлены.');info()}catch(e){msg('Не удалось записать данные.')}
};
info();
</script>
</body>
</html>
